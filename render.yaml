# ─── Backend ────────────────────────────────────────────────
- type: web
  name: sql-queryagent-backend
  runtime: python
  region: singapore
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: ANTHROPIC_API_KEY
      sync: false          # set this manually in the Render dashboard
    - key: DATABASE_URL
      value: sqlite:///./sql_agent_app.db
    - key: PYTHON_VERSION
      value: "3.11.0"

# ─── Frontend ───────────────────────────────────────────────
- type: web
  name: sql-queryagent-frontend
  runtime: static
  region: singapore
  plan: free
  rootDir: frontend
  buildCommand: npm install && npm run build
  staticPublishPath: dist
  envVars:
    - key: VITE_API_BASE_URL
      fromService:
        name: sql-queryagent-backend
        type: web
        property: host
  routes:
    - type: rewrite
      source: /*
      destination: /index.html
