services:
  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: sql-queryagent-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: DATABASE_URL
        value: sqlite:///./sql_agent_app.db
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ALLOWED_ORIGINS
        value: "https://sql-queryagent-frontend.onrender.com"

  # ─── Frontend (React / Vite → static site) ──────────────────────────────────
  - type: web
    name: sql-queryagent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://sql-queryagent-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
